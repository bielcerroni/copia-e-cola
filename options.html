<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Copia & Cola · Preferências</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 14px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      --bg: light-dark(#f7f8ff, #131827);
      --surface: light-dark(#fff, #1d2535);
      --surface-alt: light-dark(#f5f6fb, #242d3f);
      --text: light-dark(#20243a, #f3f5fd);
      --muted: light-dark(#6f7990, #a7b3ca);
      --border: light-dark(#e5e8f1, #313a4f);
      --accent: light-dark(#6d5bea, #9888ff);
      background: var(--bg); color: var(--text);
    }
    * {box-sizing:border-box}
    body {max-width:650px; margin:60px auto; padding:0 22px 48px}
    .brand {display:flex; gap:16px; align-items:center; margin-bottom:27px}
    .brand-icon {display:grid; place-items:center; flex:none; width:55px; height:55px;
      border-radius:17px; background:linear-gradient(145deg,#8d7dff,#6450dd);
      color:white; box-shadow:0 8px 24px rgba(109,91,234,.27); font-size:30px; font-weight:700}
    .eyebrow {color:var(--accent); font-size:10px; font-weight:800; letter-spacing:1.15px; margin-bottom:5px}
    h1 {font-size:26px; letter-spacing:-.8px; margin:0 0 5px; line-height:1.12}
    .description {margin:0; color:var(--muted); line-height:1.5; font-size:12px}
    .card {padding:26px; background:var(--surface); border:1px solid var(--border);
      border-radius:20px; box-shadow:0 14px 40px rgba(17,24,49,.07)}
    .section-title {font-size:11px; color:var(--accent); font-weight:800; letter-spacing:.8px;
      text-transform:uppercase; margin:1px 0 20px}
    .grid {display:grid; grid-template-columns:1fr 1fr; gap:17px}
    .field {margin-bottom:22px}
    label {display:block; font-weight:680; font-size:12px; margin-bottom:9px}
    input[type=number],textarea {width:100%; border:1px solid var(--border); outline:none;
      background:var(--surface-alt); color:var(--text); border-radius:11px;
      padding:12px 13px; font:inherit; transition:border-color .16s, box-shadow .16s}
    input[type=number]:focus,textarea:focus {border-color:var(--accent); box-shadow:0 0 0 3px light-dark(#f1edff,#292643)}
    textarea {resize:vertical; min-height:88px; line-height:1.6}
    .toggle {display:flex; align-items:center; gap:11px; padding:14px 15px;
      border:1px solid var(--border); border-radius:12px; background:var(--surface-alt); margin-bottom:23px}
    .toggle input {accent-color:var(--accent); width:17px; height:17px; margin:0; cursor:pointer}
    .toggle label {margin:0; cursor:pointer}
    .hint {font-size:12px; color:var(--muted); margin:8px 0 0; line-height:1.5}
    .actions {border-top:1px solid var(--border); padding-top:19px; display:flex; align-items:center; gap:13px; flex-wrap:wrap}
    button {border:1px solid #6754e5; color:white; border-radius:11px;
      background:linear-gradient(135deg,#8774ff,#6751df); padding:12px 19px;
      font:inherit; font-weight:750; cursor:pointer}
    button:hover {filter:brightness(1.08)}
    button:focus-visible {outline:2px solid var(--accent); outline-offset:3px}
    #status {font-size:12px; color:var(--accent)}
    @media(max-width:550px) {body {margin:30px auto; padding:0 14px 30px} .card {padding:18px} .grid {grid-template-columns:1fr; gap:0}}
  </style>
</head>
<body>
  <header class="brand">
    <span class="brand-icon" aria-hidden="true">↥</span>
    <div>
      <div class="eyebrow">PREFERÊNCIAS DA EXTENSÃO</div>
      <h1>Copia & Cola</h1>
      <p class="description">Personalize seu painel de anexos rápidos.</p>
    </div>
  </header>
  <form class="card" id="preferences">
    <div class="section-title">Arquivos recentes</div>
    <div class="grid">
      <div class="field">
        <label for="recentCount">Downloads exibidos</label>
        <input id="recentCount" type="number" min="1" max="20" required>
      </div>
      <div class="field">
        <label for="maxFileMB">Tamanho máximo por arquivo (MB)</label>
        <input id="maxFileMB" type="number" min="1" max="40" required>
      </div>
    </div>
    <div class="toggle">
      <input id="showClipboard" type="checkbox">
      <label for="showClipboard">Mostrar imagens da área de transferência</label>
    </div>
    <div class="field">
      <label for="excludedSites">Sites onde o painel não deve aparecer</label>
      <textarea id="excludedSites" placeholder="exemplo.com&#10;intranet.empresa.com"></textarea>
      <p class="hint">Informe um domínio por linha. Os subdomínios também serão ignorados.</p>
    </div>
    <div class="actions">
      <button type="submit">Salvar preferências</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
  </form>
  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
