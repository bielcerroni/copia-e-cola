<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Copia & Cola · Preferências</title>
  <style>
    :root { color-scheme: light dark; font: 15px system-ui,-apple-system,Segoe UI,sans-serif; background: light-dark(#f6f7fb,#13161e); color: light-dark(#202535,#f3f5fb); }
    body { max-width: 580px; margin: 56px auto; padding: 0 24px; }
    h1 { font-size: 28px; margin-bottom: 5px; letter-spacing: -.7px; }
    p { color: light-dark(#657084,#aab4c9); line-height: 1.5; }
    .card { padding: 24px; margin-top: 26px; background: light-dark(white,#202632); border: 1px solid light-dark(#e1e6ee,#363e4c); border-radius: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input[type=number],textarea { width: 100%; box-sizing: border-box; border: 1px solid light-dark(#ced5e0,#4b5668); background: light-dark(#fff,#111722); border-radius: 9px; color: inherit; padding: 11px; font: inherit; margin-bottom: 20px; }
    textarea { resize: vertical; min-height: 82px; }
    .toggle { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .toggle label { margin: 0; }
    .hint { font-size: 13px; margin: -11px 0 20px; }
    button { border: 0; background: #6b62e8; color: white; font: inherit; font-weight: 700; padding: 11px 20px; border-radius: 10px; cursor: pointer; }
    #status { display: inline-block; margin-left: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Copia & Cola</h1>
  <p>Configure o painel de anexos rápidos. Seus arquivos não são enviados para nenhum servidor da extensão.</p>
  <form class="card" id="preferences">
    <label for="recentCount">Downloads recentes exibidos</label>
    <input id="recentCount" type="number" min="1" max="20" required>
    <label for="maxFileMB">Tamanho máximo por download (MB)</label>
    <input id="maxFileMB" type="number" min="1" max="40" required>
    <div class="toggle"><input id="showClipboard" type="checkbox"><label for="showClipboard">Mostrar imagens da área de transferência</label></div>
    <label for="excludedSites">Sites onde o painel não deve aparecer</label>
    <textarea id="excludedSites" placeholder="exemplo.com&#10;intranet.empresa.com"></textarea>
    <p class="hint">Um domínio por linha. Os subdomínios também serão ignorados.</p>
    <button type="submit">Salvar preferências</button><span id="status" role="status" aria-live="polite"></span>
  </form>
  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
